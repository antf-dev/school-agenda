<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agenda – personal planner, tasks, XP and streaks · v10</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* Apply the saved theme before first paint (small preference only; real data lives in IndexedDB). */
(function(){try{var t=localStorage.getItem('agenda-theme')||'dark';
var r=t==='system'?(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'):t;
document.documentElement.setAttribute('data-theme',r==='light'?'light':'dark');}catch(e){}})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#0f1220;--bg2:#141829;--card:#1a1f35;--card2:#222844;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.15);
  --text:#eef0fb;--muted:#9ba2c7;--faint:#6c7399;
  --accent:#8b9bff;--accent-ink:#0f1220;--accent-soft:rgba(139,155,255,.15);
  --xp:#f6c05a;--xp-soft:rgba(246,192,90,.15);
  --ok:#52d6a6;--ok-soft:rgba(82,214,166,.15);--bad:#ff6f83;--bad-soft:rgba(255,111,131,.15);
  --shadow:0 18px 50px rgba(0,0,0,.45);
  --font-d:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{
  --bg:#f2f3fa;--bg2:#e9ebf7;--card:#ffffff;--card2:#eef0fa;--line:rgba(20,25,60,.09);--line2:rgba(20,25,60,.17);
  --text:#161a33;--muted:#576088;--faint:#8a90b3;
  --accent:#4a5bf0;--accent-ink:#ffffff;--accent-soft:rgba(74,91,240,.11);
  --xp:#a96d00;--xp-soft:rgba(226,160,30,.18);
  --ok:#0f8f66;--ok-soft:rgba(15,143,102,.12);--bad:#d33851;--bad-soft:rgba(211,56,81,.1);
  --shadow:0 18px 50px rgba(30,40,100,.18);color-scheme:light;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased;min-height:100vh}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(900px 500px at 8% -10%,var(--accent-soft),transparent 60%),radial-gradient(700px 400px at 100% 0%,var(--xp-soft),transparent 55%);opacity:.8;z-index:0}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3{font-family:var(--font-d);font-weight:700;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}
.ico{flex:none}

/* boot */
.boot{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:100}
.boot-card{display:grid;gap:14px;justify-items:center;color:var(--muted)}
.boot-mark{width:38px;height:38px;border-radius:50%;border:3px solid var(--line2);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* shell */
.app{position:relative;z-index:1;display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;padding:20px 14px;border-right:1px solid var(--line);background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px)}
.brand{display:flex;align-items:center;gap:10px;padding:2px 10px 18px;font-family:var(--font-d);font-weight:700;font-size:20px}
.brand i{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--xp));display:grid;place-items:center;color:var(--accent-ink);font-style:normal;font-size:15px}
.nav{display:grid;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--muted);font-weight:500;transition:background .15s,color .15s}
.nav a:hover{background:var(--card);color:var(--text)}
.nav a.on{background:var(--accent-soft);color:var(--text)}
.nav a.on .ico{color:var(--accent)}
.nav .badge{margin-left:auto;background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;font-weight:600}
.minilevel{margin-top:auto;padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.minilevel b{font-family:var(--font-d);font-size:16px}
.minilevel small{display:block;color:var(--muted);margin:2px 0 10px}
.main{min-width:0;padding:0 28px 40px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;padding:16px 0 14px;background:linear-gradient(var(--bg) 70%,transparent)}
.search{flex:1;max-width:520px;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 12px;color:var(--muted)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;padding:11px 0;color:var(--text)}
.search:focus-within{border-color:var(--accent)}
.topbar .sp{flex:1}
.saved{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.saved i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.saved.saving i{background:var(--xp);animation:pulse 1s infinite}
.saved.error i,.saved.unsaved i{background:var(--bad)}
@keyframes pulse{50%{opacity:.3}}
.view{max-width:1120px;margin:0 auto}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:6px 0 18px}
.page-h h1{font-size:30px;line-height:1.1}
.page-h p{color:var(--muted);margin-top:4px}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line2);background:var(--card);padding:9px 14px;border-radius:12px;font-weight:600;transition:transform .12s,background .15s,border-color .15s}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.btn.danger.solid{background:var(--bad);color:#fff;border-color:transparent}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--text);background:var(--card)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.5;pointer-events:none}
.iconbtn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--muted);position:relative}
.iconbtn:hover{color:var(--text);border-color:var(--line2)}
.iconbtn.sm{width:30px;height:30px;border-radius:9px;border-color:transparent;background:transparent}
.iconbtn .dot{position:absolute;top:-4px;right:-4px;background:var(--bad);color:#fff;border-radius:99px;font-size:10px;min-width:17px;padding:1px 4px;font-weight:700;text-align:center}
.fab{display:none}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px}
.card h2{font-size:18px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h2 .count{font-family:var(--font);font-size:12.5px;font-weight:600;color:var(--muted);background:var(--card2);border-radius:99px;padding:1px 9px}
.grid{display:grid;gap:16px}
.cols-2{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.stack{display:grid;gap:12px}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.between{justify-content:space-between}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,.8fr) minmax(0,1fr);gap:0;padding:0;overflow:hidden}
.hero>div{padding:22px}
.hero>div+div{border-left:1px solid var(--line)}
.hello{font-size:15px;color:var(--muted);margin-bottom:14px}
.hello b{display:block;font-family:var(--font-d);font-size:26px;color:var(--text);line-height:1.15;margin-bottom:2px}
.levelrow{display:flex;gap:18px;align-items:center}
.ring{position:relative;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--card2)}
.ring-fill{fill:none;stroke:var(--xp);stroke-linecap:round;transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1)}
.ring.today .ring-fill{stroke:var(--ok)}
.ring-in{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring-in b{font-family:var(--font-d);font-size:34px;line-height:1}
.ring-in small{color:var(--muted);font-size:12px}
.xpnum{font-family:var(--font-d);font-size:24px;font-weight:700}
.xpnum small{font-family:var(--font);font-size:14px;color:var(--muted);font-weight:500}
.bar{height:10px;border-radius:99px;background:var(--card2);overflow:hidden}
.bar.sm{height:6px}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--xp));transition:width .9s cubic-bezier(.2,.8,.2,1)}
.bar.ok i{background:var(--ok)}
.bar.sub i{background:var(--ac,var(--accent))}
.streakbig{display:flex;align-items:center;gap:10px;font-family:var(--font-d);font-size:26px;font-weight:700}
.streakbig span{font-size:30px}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:14px}
.heat i{aspect-ratio:1;border-radius:6px;background:var(--card2);display:block}
.heat i.on{background:var(--xp)}
.heat i.rest{background:color-mix(in srgb,var(--card2) 50%,transparent)}
.heat i.today{outline:2px solid var(--accent);outline-offset:1px}
.heat i.fut{opacity:.3}
.heatlabels{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:12px;font-size:11px;color:var(--faint);text-align:center}

/* homework cards */
.hwlist{display:grid;gap:10px}
.hw{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:start;padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line);position:relative;transition:border-color .15s,opacity .2s}
.hw:hover{border-color:var(--line2)}
.hw.overdue{border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.hw.overdue::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:3px;background:var(--bad)}
.hw.completed .hw-title{text-decoration:line-through;text-decoration-color:var(--faint);color:var(--muted)}
.hw.completed{opacity:.78}
.check{width:30px;height:30px;border-radius:50%;border:2px solid var(--line2);background:transparent;display:grid;place-items:center;color:transparent;margin-top:2px;transition:background .18s,border-color .18s,transform .18s}
.check:hover{border-color:var(--ok)}
.check svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .3s .05s}
.hw.completed .check{background:var(--ok);border-color:var(--ok);color:#06251b;animation:pop .35s}
.hw.completed .check svg{stroke-dashoffset:0}
@keyframes pop{40%{transform:scale(1.22)}}
.hw-main{min-width:0;cursor:pointer}
.hw-top{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:2px}
.hw-title{font-size:16.5px;font-family:var(--font);font-weight:600;line-height:1.3}
.hw-desc{color:var(--muted);font-size:14px;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hw-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.hw-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.hw-side .acts{display:flex;gap:2px}
.tile{--ac:var(--accent);display:inline-grid;place-items:center;width:38px;height:38px;border-radius:12px;background:color-mix(in srgb,var(--ac) 20%,transparent);color:var(--ac);font-weight:700;font-size:17px;line-height:1;flex:none}
.tile.sm{width:22px;height:22px;border-radius:7px;font-size:12px}
.tile.lg{width:56px;height:56px;border-radius:16px;font-size:26px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--card2);color:var(--muted);white-space:nowrap}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.xp{background:var(--xp-soft);color:var(--xp)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.hi{background:var(--bad-soft);color:var(--bad)}
.pill.lo{background:var(--card2);color:var(--faint)}
.xpchip{font-family:var(--font-d);font-weight:700;color:var(--xp);font-size:15px;white-space:nowrap}
.xpchip.done{color:var(--faint);font-weight:600;font-size:13px}
.empty{padding:34px 18px;text-align:center;color:var(--muted);border:1px dashed var(--line2);border-radius:18px}
.empty h3{color:var(--text);font-size:18px;margin-bottom:6px}
.empty .row{justify-content:center;margin-top:14px}

/* filters */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);padding:6px 13px;border-radius:99px;font-weight:600;font-size:13.5px;color:var(--muted)}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 16px}
.class-targets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.class-target{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--line);background:var(--bg2);border-radius:12px;cursor:pointer;font-weight:600}.class-target:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}.class-target input{accent-color:var(--accent);width:17px;height:17px}@media(max-width:600px){.class-targets{grid-template-columns:1fr}.class-target{min-height:44px}}
.sel,.inp,.txt{background:var(--bg2);border:1px solid var(--line2);border-radius:12px;padding:9px 11px;outline:0;width:100%;min-width:0}
.sel:focus,.inp:focus,.txt:focus{border-color:var(--accent)}
.filters .sel,.filters .inp{width:auto}
.txt{resize:vertical;min-height:72px}
.field{display:grid;gap:5px}
.field>span{font-size:13px;font-weight:600;color:var(--muted)}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fgrid .full{grid-column:1/-1}
.hint{font-size:12.5px;color:var(--faint)}

/* subjects */
.subgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.subcard{display:grid;gap:12px;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;transition:border-color .15s,transform .15s}
.subcard:hover{border-color:var(--ac,var(--accent))}
.subcard b{font-family:var(--font-d);font-size:17px}
.subcard .nums{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.subhead{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.subhead h1{font-size:32px}
.stats3{display:flex;gap:24px;flex-wrap:wrap;margin-top:6px;color:var(--muted)}
.stats3 b{color:var(--text);font-family:var(--font-d);font-size:20px;margin-right:5px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:30px;height:30px;border-radius:50%;border:3px solid transparent;background:var(--c)}
.swatch.on{border-color:var(--text)}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .dow{font-size:12px;color:var(--faint);text-align:center;padding:4px 0}
.day{min-height:78px;border-radius:12px;background:var(--bg2);border:1px solid transparent;padding:6px 7px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:6px}
.day:hover{border-color:var(--line2)}
.day.out{opacity:.4}
.day.today .n{background:var(--accent);color:var(--accent-ink)}
.day.sel{border-color:var(--accent);background:var(--accent-soft)}
.day .n{font-size:13px;font-weight:600;width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
.dots{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.dots i{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-style:normal;font-weight:700;color:var(--muted)}
.dots i::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
.dots i.ok::before{background:var(--ok)}
.dots i.bad::before{background:var(--bad)}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend span::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--accent)}
.legend .ok::before{background:var(--ok)}.legend .bad::before{background:var(--bad)}

/* achievements & stats */
.achgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.ach{display:grid;gap:10px;padding:16px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.ach .ic{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;font-size:25px;background:var(--xp-soft)}
.ach.locked .ic{filter:grayscale(1);opacity:.45;background:var(--card2)}
.ach.unlocked{border-color:color-mix(in srgb,var(--xp) 40%,transparent)}
.ach b{font-family:var(--font-d);font-size:16.5px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.kpi{padding:14px 16px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.kpi b{display:block;font-family:var(--font-d);font-size:26px;line-height:1.15}
.kpi span{font-size:13px;color:var(--muted)}
.vbars{display:flex;align-items:flex-end;gap:6px;height:190px;padding-top:20px}
.vb{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px}
.vb .col{width:100%;max-width:34px;border-radius:8px 8px 3px 3px;background:linear-gradient(var(--accent),color-mix(in srgb,var(--accent) 45%,transparent));min-height:3px;transition:height .6s}
.vb.xpm .col{background:linear-gradient(var(--xp),color-mix(in srgb,var(--xp) 45%,transparent))}
.vb em{font-style:normal;font-size:11px;color:var(--muted);font-weight:600}
.vb small{font-size:10.5px;color:var(--faint);white-space:nowrap}
.hbars{display:grid;gap:12px}
.hb{display:grid;grid-template-columns:130px minmax(0,1fr) 52px;gap:10px;align-items:center;font-size:14px}
.hb span:last-child{text-align:right;color:var(--muted);font-weight:600}
.seg{display:inline-flex;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:9px;color:var(--muted);font-weight:600;font-size:13px}
.seg button.on{background:var(--card2);color:var(--text)}

.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;padding:4px 0 6px}
.photo-tile{display:grid;gap:7px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;color:var(--text)}
.photo-tile:hover{border-color:var(--accent)}
.photo-tile img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;background:var(--bg2)}
.photo-tile span{font-size:12px;color:var(--muted);padding:0 3px 2px}

/* settings */
.set-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 0;border-top:1px solid var(--line)}
.set-row:first-of-type{border-top:0}
.set-row small{display:block;color:var(--muted)}
.switch{position:relative;display:inline-block;width:44px;height:26px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:99px;background:var(--card2);border:1px solid var(--line2);transition:.2s;pointer-events:none}

const AUTH_DB_NAME='school-agenda-supabase-auth';

async function ensureSupabaseUser(){
  if(!SUPABASE_CONFIGURED||!supabaseClient){SUPABASE_AUTH_LAST_ERROR='Supabase is not configured.';return null;}
  if(SUPABASE_CACHED_USER?.id)return SUPABASE_CACHED_USER;
  if(SUPABASE_AUTH_PROMISE)return SUPABASE_AUTH_PROMISE;
  SUPABASE_AUTH_PROMISE=(async()=>{
    try{
      SUPABASE_AUTH_LAST_ERROR='';
      const {data,error}=await supabaseClient.auth.getSession();
      if(error)throw error;
      if(data?.session?.user){SUPABASE_CACHED_USER=data.session.user;return SUPABASE_CACHED_USER;}
      const r=await supabaseClient.auth.signInAnonymously();
      if(r.error){SUPABASE_AUTH_LAST_ERROR=describeSupabaseAuthError(r.error);throw r.error;}
      const u=r.data?.user||r.data?.session?.user;
      if(u){SUPABASE_CACHED_USER=u;return u;}
      SUPABASE_AUTH_LAST_ERROR='Supabase returned no anonymous user/session.';
      return null;
    }catch(e){
      if(!SUPABASE_AUTH_LAST_ERROR)SUPABASE_AUTH_LAST_ERROR=describeSupabaseAuthError(e);
      console.error('Supabase authentication error:',e);
      return null;
    }finally{SUPABASE_AUTH_PROMISE=null;}
  })();
  return SUPABASE_AUTH_PROMISE;
}

const STORES=[['meta','key'],['subjects','id'],['homework','id'],['achievements','id'],['files','id'],['blobs','id'],['xpLog','id'],['notifications','id']];
const Data={
  db:null, ok:false, pending:0, chain:Promise.resolve(), onStatus:()=>{}, bc:null,
  open(){return new Promise((res,rej)=>{
    if(!window.indexedDB)return rej(new Error('IndexedDB is not available in this browser.'));
    let req;try{req=indexedDB.open(DB_NAME,DB_VER)}catch(e){return rej(e)}
    req.onupgradeneeded=ev=>{
      const db=req.result;
      /* SAFETY RULE: schema upgrades may ONLY add missing stores.
         Never clear, replace, or rewrite existing records during an app update. */
      for(const[n,k]of STORES)if(!db.objectStoreNames.contains(n))db.createObjectStore(n,{keyPath:k});
      /* Existing object stores are intentionally left untouched. */
    };
    req.onsuccess=()=>{this.db=req.result;this.ok=true;this.db.onversionchange=()=>{this.db.close();this.ok=false};res()};
    req.onerror=()=>rej(req.error||new Error('Could not open the database.'));
    req.onblocked=()=>rej(new Error('The database is blocked by another tab.'));
  })},
  get(store,key){return new Promise((res,rej)=>{const r=this.db.transaction(store).objectStore(store).get(key);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  all(store){return new Promise((res,rej)=>{const r=this.db.transaction(store).objectStore(store).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})},
  _w(pairs,dels=[]){return new Promise((res,rej)=>{const names=[...new Set([...pairs.map(p=>p[0]),...dels.map(p=>p[0])])];
    const tx=this.db.transaction(names,'readwrite');
    pairs.forEach(([s,v])=>tx.objectStore(s).put(v));dels.forEach(([s,k])=>tx.objectStore(s).delete(k));
    tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error||new Error('Write aborted'))})},
  /* All writes go through one ordered queue so the latest change always wins. */
  write(pairs,dels=[]){

    const p=this.chain.then(()=>this._w(pairs,dels));this.chain=p.catch(()=>{});

/* ----- startup: restore saved data first; only seed defaults if there is truly nothing saved ----- */
async function loadState(){
  const [meta,subs,hws,ach,files,xp,notifs]=await Promise.all(['meta','subjects','homework','achievements','files','xpLog','notifications'].map(s=>Data.all(s)));
  const m=Object.fromEntries(meta.filter(r=>r&&r.key).map(r=>[r.key,r.value]));
  const fresh=!m.initialized&&!m.student&&!subs.length&&!hws.length;
  let issues=0;
  S.student=normStudent(m.student);S.settings=normSettings(m.settings);
  S.subjects=subs.map(normSubject).filter(Boolean).sort((a,b)=>a.order-b.order);
  S.homework=hws.map(r=>{const h=normHW(r);if(!h)issues++;return h}).filter(Boolean);
  S.ach=Object.fromEntries(ach.filter(a=>a&&a.id).map(a=>[a.id,a]));
  S.files=Object.fromEntries(files.filter(f=>f&&f.id).map(f=>[f.id,f]));
  S.xpLog=xp.filter(e=>e&&e.id&&Number.isFinite(+e.amount));
  S.notifs=notifs.filter(n=>n&&n.id).sort((a,b)=>String(b.ts).localeCompare(String(a.ts)));
  S.issues=issues;
  const writes=[];
  /* Migration is additive-only: existing records are never replaced by defaults. */
  if(fresh){
    writes.push(['meta',{key:'student',value:S.student}],['meta',{key:'settings',value:S.settings}],['meta',{key:'schema',value:SCHEMA_VERSION}],['meta',{key:'dataFormat',value:DATA_FORMAT_VERSION}],['meta',{key:'initialized',value:true}]);
  }else{
    if(!m.student)writes.push(['meta',{key:'student',value:S.student}]);
    if(!m.settings)writes.push(['meta',{key:'settings',value:S.settings}]);
    if(!m.schema)writes.push(['meta',{key:'schema',value:SCHEMA_VERSION}]);
    if(m.dataFormat!==DATA_FORMAT_VERSION)writes.push(['meta',{key:'dataFormat',value:DATA_FORMAT_VERSION}]);
    if(!m.initialized)writes.push(['meta',{key:'initialized',value:true}]);
  }
  if(!S.subjects.length){S.subjects=seedSubjects();S.subjects.forEach(s=>writes.push(['subjects',s]));}   /* additive only */
  if(writes.length&&Data.ok)await Data.write(writes);
  applyTheme();
}

function getStreak(){
  const days=new Set(S.student.activeDays);
  if(!days.size)return{current:0,best:S.student.bestStreak||0,doneToday:false};
  const today=todayStr(),first=[...days].sort()[0];
  const missed=d=>S.homework.some(h=>h.dueDate===d&&(!h.completed||localDate(h.completedAt)>d));
  let d=today,count=0;
  while(d>=first){
    if(days.has(d))count++;
    else if(d===today){/* today isn't over yet */}
    else if(!missed(d)){/* a day off or nothing outstanding: no penalty */}
    else break;
    d=addDays(d,-1);
  }
  return{current:count,best:Math.max(S.student.bestStreak||0,count),doneToday:days.has(today)};
}

function toast(msg,{kind='',ms=3400}={}){
  const el=document.createElement('div');el.className='toast '+kind;el.textContent=msg;
  const root=$('#toasts');root.appendChild(el);while(root.children.length>3)root.firstChild.remove();
  setTimeout(()=>el.remove(),ms);
}
function pushNotif(n){S.notifs.unshift(n);P.notif(n);
  if(S.notifs.length>100){const drop=S.notifs.splice(100);P.delNotifs(drop.map(x=>x.id))}
  if(S.settings.browserNotify){try{if(Notification.permission==='granted')new Notification(n.title,{body:n.body})}catch(e){}}
  updateChrome();}
function notify(type,title,body='',{icon=''}={}){
  if(!S.settings.notify[type])return;
  pushNotif({id:uid('n'),type,title,body,icon,ts:new Date().toISOString(),read:false});
  toast(icon?`${icon} ${title}`:title,{kind:type==='xp'?'xp':''});
}
function refreshReminders(){
  const t=todayStr(),tm=addDays(t,1);
  for(const h of S.homework){
    if(h.completed)continue;
    let type=null,title='';
    if(statusOf(h)==='overdue'){type='overdue';title=`Overdue: ${subj(h.subjectId).name} – ${h.title}`}
    else if(h.dueDate===t){type='dueToday';title=`Due today: ${subj(h.subjectId).name} – ${h.title}`}
    else if(h.dueDate===tm){type='dueTomorrow';title=`Due tomorrow: ${subj(h.subjectId).name} – ${h.title}`}
    if(!type||!S.settings.notify[type])continue;
    const id=`r-${type}-${h.id}-${t}`;
    if(S.notifs.some(n=>n.id===id))continue;
    pushNotif({id,type,title,body:h.dueTime?`Due at ${fmtTime(h.dueTime)}`:'',icon:type==='overdue'?'⚠️':'⏰',ts:new Date().toISOString(),read:false});
  }
}

/* XP engine: each assignment can award its XP exactly once (xpAwarded is never reset). */
function awardXP(h){
  const T=S.student,today=todayStr(),before=levelInfo(T.totalXP).level;let total=0;
  const add=(amount,reason)=>{if(amount<=0)return;total+=amount;
    const e={id:uid('xp'),ts:new Date().toISOString(),date:today,amount,reason,hwId:h.id,subjectId:h.subjectId,subjectName:subj(h.subjectId).name};
    S.xpLog.push(e);P.xp(e)};
  add(h.xp,'Assignment');
  if(h.dueDate>today){add(Math.round(h.xp*BONUS.earlyPct),'Early bonus');T.earlyCount++}
  h.xpAwarded=true;T.completedCount++;
  const firstToday=!T.activeDays.includes(today);
  if(firstToday)T.activeDays.push(today);
  const stk=getStreak();
  if(firstToday&&stk.current>=2){add(Math.min(stk.current,BONUS.streakCap)*BONUS.streakPerDay,'Streak bonus');
    notify('streak',`${stk.current}-day streak`,'You\u2019re keeping it going.',{icon:'🔥'})}
  const todays=S.homework.filter(x=>x.dueDate===today);
  if(todays.length&&todays.every(x=>x.completed)&&!T.perfectDays.includes(today)){T.perfectDays.push(today);add(BONUS.daily,'Daily bonus');}
  T.totalXP+=total;T.bestStreak=Math.max(T.bestStreak,stk.current);
  const after=levelInfo(T.totalXP).level;T.level=after;
  notify('xp',`+${total} XP`,`${subj(h.subjectId).name}: ${h.title}`);
  if(after>before)notify('levelUp',`Level ${after}`,'You levelled up.',{icon:'⬆️'});
  return{total,levelUp:after>before?after:null,from:before};
}

/* =====================================================================
   9. FILES  (images are resized, stored in IndexedDB as data URLs; thumbnails kept with metadata)
   ===================================================================== */
const readAsDataURL=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(f)});
function dataUrlToBlob(u){const [h,b]=u.split(',');const mime=/data:([^;]+)/.exec(h)?.[1]||'application/octet-stream';const bin=atob(b);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:mime})}
const canvasBlob=(c,type,q)=>new Promise(res=>c.toBlob(res,type,q));
function imageFileSupported(file){
  const type=String(file?.type||'').toLowerCase();
  if(/^image\/(jpeg|jpg|png|webp)$/.test(type))return true;
  const name=String(file?.name||'').toLowerCase();
  return /\.(jpe?g|png|webp)$/.test(name);
}
async function loadBitmap(file){
  if(!file)throw new Error('No image file was selected.');
  try{
    const bmp=await createImageBitmap(file);
    return bmp;
  }catch(e){}
  const url=URL.createObjectURL(file);
  try{
    return await new Promise((res,rej)=>{
      const i=new Image();
      i.onload=()=>{URL.revokeObjectURL(url);res(i)};
      i.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('This image format could not be decoded by your browser. Please use JPG, PNG, or WEBP.'))};
      i.src=url;
    });
  }catch(e){throw e}
}
async function processImage(file){
  if(!imageFileSupported(file))throw new Error('Please choose a JPG, PNG, or WEBP image.');
  const bmp=await loadBitmap(file);
  const w0=bmp.width||bmp.naturalWidth,h0=bmp.height||bmp.naturalHeight;
  if(!w0||!h0)throw new Error('The selected image has no readable dimensions.');
  const draw=(max,q)=>{const s=Math.min(1,max/Math.max(w0,h0));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w0*s));c.height=Math.max(1,Math.round(h0*s));
    const g=c.getContext('2d');if(!g)throw new Error('Your browser could not create an image canvas.');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(bmp,0,0,c.width,c.height);return c};
  let max=1600,q=.78,blob=null,big=null;
  for(let i=0;i<6;i++){
    big=draw(max,q);blob=await canvasBlob(big,'image/jpeg',q);
    if(blob&&blob.size<=850*1024)break;
    if(i===1)q=.68;else if(i===2)q=.58;else if(i>=3){max=Math.max(1000,Math.round(max*.82));q=Math.max(.52,q-.03)}
  }
  if(!blob)throw new Error('Your browser could not convert the image. Try a JPG or PNG.');
  if(blob.size>950*1024)throw new Error('That photo is still too large after compression. Please choose a smaller image.');
  const small=draw(220,.72);
  return{blob,dataUrl:await readAsDataURL(blob),thumb:small.toDataURL('image/jpeg',.72),width:big.width,height:big.height};
}
async function storeImage(file,kind,extra={}){
  let p;
  try{
    p=await processImage(file);
  }catch(err){
    /* Keep upload functionality working even when a browser cannot draw/convert
       a particular supported image. Store the original file/data instead. */
    if(!imageFileSupported(file))throw err;
    const dataUrl=await readAsDataURL(file);
    let thumb=dataUrl;
    try{
      const bmp=await loadBitmap(file);
      const w0=bmp.width||bmp.naturalWidth,h0=bmp.height||bmp.naturalHeight;
      const s=Math.min(1,220/Math.max(w0,h0));
      const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w0*s));c.height=Math.max(1,Math.round(h0*s));
      const g=c.getContext('2d');if(g){g.drawImage(bmp,0,0,c.width,c.height);thumb=c.toDataURL('image/jpeg',.72)}
    }catch(_){}
    p={blob:file,dataUrl,thumb,width:file.width||0,height:file.height||0};
  }
  const type=String(file.type||'image/jpeg').toLowerCase();
  const meta={id:uid('img'),kind,name:file.name||'image.jpg',type,size:file.size||p.blob.size||0,thumb:p.thumb,createdAt:new Date().toISOString(),extractedText:'',ocr:null,...extra};
  S.files[meta.id]=meta;await P.file(meta,p.dataUrl);
  return{meta,blob:p.blob,dataUrl:p.dataUrl,file};
}
async function storeAttachment(file){
  if(file.type.startsWith('image/')&&/jpe?g|png|webp/.test(file.type)){return(await storeImage(file,'attachment')).meta}
  if(file.size>5*1024*1024)throw new Error(`${file.name} is larger than 5 MB.`);
  const data=await readAsDataURL(file);
  const meta={id:uid('file'),kind:'attachment',name:file.name,type:file.type||'application/octet-stream',size:file.size,thumb:'',createdAt:new Date().toISOString(),extractedText:'',ocr:null};
  S.files[meta.id]=meta;await P.file(meta,data);return meta;
}

const Cap={_c:{},get(name){
  if(this._c[name])return this._c[name];
  this._c[name]=(async()=>{try{if(window.claude&&claude.use)return await claude.use(name)}catch(e){}return null})();
  return this._c[name];
},
  async quick(name,ms=4000){return Promise.race([this.get(name),sleep(ms).then(()=>null)])}};

function matchSubject(name){
  if(!name)return'';const n=String(name).trim().toLowerCase();
  for(const s of S.subjects){
    if(s.name.toLowerCase()===n)return s.id;
    const al=SUBJECT_ALIASES[s.id]||[];if(al.includes(n))return s.id;
  }
  for(const s of S.subjects){if(n.includes(s.name.toLowerCase())||s.name.toLowerCase().includes(n))return s.id}
  return'';
}
async function readImageWithAI(blob){
  const sample=await Cap.quick('sample');
  if(!sample)throw{code:'unavailable'};
  const lim=await sample.limits().catch(()=>null);
  if(!lim||!lim.images)throw{code:'images_unavailable'};
  const today=new Date();
  const prompt=`You are helping a student turn a photo or screenshot of a school agenda, homework board, or textbook page into assignments.
Today is ${WDL[today.getDay()]}, ${todayStr()}.
Known subjects: ${S.subjects.map(s=>s.name).join(', ')}.
Read the image carefully. For every separate homework item you can actually see, return one object. If something is not visible or unclear, use null instead of guessing. Resolve relative dates ("tomorrow", "Thursday") using today's date.
Reply with only JSON in exactly this shape:
{"rawText":"all text you could read","items":[{"subject":"one of the known subjects or null","title":"short title, e.g. Exercises 12-20","description":"details or null","dueDate":"YYYY-MM-DD or null","dueTime":"HH:MM (24h) or null","confidence":"high|medium|low"}]}`;
  const out=await sample.json(prompt,{images:blob});
  if(!out||typeof out!=='object')throw{code:'invalid_json'};
  const items=(Array.isArray(out.items)?out.items:[]).slice(0,20).map(it=>({
    subjectId:matchSubject(it.subject),title:String(it.title||'').slice(0,160),description:it.description?String(it.description).slice(0,600):'',
    dueDate:parseYmd(it.dueDate)?it.dueDate:'',dueTime:/^\d{2}:\d{2}$/.test(it.dueTime||'')?it.dueTime:'',confidence:['high','medium','low'].includes(it.confidence)?it.confidence:'low'}));
  return{rawText:String(out.rawText||'').slice(0,4000),items};
}

/* ----- Agenda ----- */
function groupFor(h){
  const t=todayStr();
  if(h.dueDate<t)return h.completed?'Earlier':'Overdue';
  if(h.dueDate===t)return'Today';if(h.dueDate===addDays(t,1))return'Tomorrow';
  const we=addDays(weekStart(t),6);
  if(h.dueDate<=we)return'This week';if(h.dueDate<=addDays(we,7))return'Next week';return'Later';
}
function viewAgenda(){
  const order=['Overdue','Today','Tomorrow','This week','Next week','Later','Earlier'];
  const showDone=S.settings.showCompleted;
  const items=S.homework.filter(h=>showDone||!h.completed).sort(cmp);
  const groups=Object.fromEntries(order.map(o=>[o,[]]));items.forEach(h=>groups[groupFor(h)].push(h));
  const parts=order.filter(o=>groups[o].length).map(o=>{
    const g=groups[o];const d=g.filter(h=>h.completed).length;
    return`<section class="card" style="margin-bottom:14px"><h2>${o} <span class="count">${g.length}</span>${o==='Overdue'?'<span class="pill bad">Needs attention</span>':''}${d?`<span class="muted" style="font-size:13px;font-weight:500;margin-left:auto">${d} done</span>`:''}</h2>${hwList(g,'')}</section>`}).join('');
  return`<div class="page-h"><div><h1>Agenda</h1><p>Your schedule, tasks and deadlines in one place.</p></div>
    <label class="row" style="gap:10px"><span class="muted">Show completed</span><span class="switch"><input type="checkbox" data-set="showCompleted" ${showDone?'checked':''}><span></span></span></label></div>
    ${parts||`<div class="empty"><h3>Nothing on your agenda</h3><p>Add a task, homework, test or project to see it laid out by date.</p>${addButtons}</div>`}`;
}

/* ----- Homework (search + filters) ----- */
function filterHW(){
  const f=ui.f,t=todayStr(),q=ui.query.trim().toLowerCase().split(/\s+/).filter(Boolean);
  return S.homework.filter(h=>{
    const st=statusOf(h),s=subj(h.subjectId);
    if(f.quick==='today'&&h.dueDate!==t)return false;
    if(f.quick==='active'&&h.completed)return false;
    if(f.quick==='completed'&&!h.completed)return false;
    if(f.quick==='overdue'&&st!=='overdue')return false;
    if(f.subject&&h.subjectId!==f.subject)return false;
    if(f.priority&&h.priority!==f.priority)return false;
    if(f.difficulty&&h.difficulty!==f.difficulty)return false;
    if(f.date&&h.dueDate!==f.date)return false;
    if(q.length){const hay=[h.title,h.description,h.notes,s.name,TYPES[h.type],h.dueDate,fmtDate(h.dueDate)].join(' ').toLowerCase();if(!q.every(w=>hay.includes(w)))return false}
    return true;
  }).sort((a,b)=>(a.completed-b.completed)||(a.completed?String(b.completedAt).localeCompare(String(a.completedAt)):cmp(a,b)));
}
function viewHomework(){
  const f=ui.f;
  const quick=[['all','All'],['today','Today'],['active','Active'],['completed','Completed'],['overdue','Overdue']];
  const dirty=f.subject||f.priority||f.difficulty||f.date||ui.query;
  return`<div class="page-h"><div><h1>Homework</h1><p>Check things off, earn XP.</p></div><button class="btn primary add-btn" data-act="add" style="display:inline-flex!important">${ico('plus',18)}Add homework</button></div>
  <div class="chips">${quick.map(([k,l])=>`<button class="chip ${f.quick===k?'on':''}" data-act="qf" data-k="${k}">${l}</button>`).join('')}</div>
  <div class="filters">
    <select class="sel" data-filter="subject" aria-label="Subject"><option value="">All subjects</option>${S.subjects.map(s=>`<option value="${esc(s.id)}" ${f.subject===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select>
    <select class="sel" data-filter="priority" aria-label="Priority"><option value="">Any priority</option>${Object.entries(PRIO).map(([k,v])=>`<option value="${k}" ${f.priority===k?'selected':''}>${v.label} priority</option>`).join('')}</select>
    <select class="sel" data-filter="difficulty" aria-label="Difficulty"><option value="">Any difficulty</option>${Object.entries(DIFF).map(([k,v])=>`<option value="${k}" ${f.difficulty===k?'selected':''}>${v.label}</option>`).join('')}</select>
    <input class="inp" type="date" data-filter="date" value="${esc(f.date)}" aria-label="Due date">
    ${dirty?`<button class="btn ghost sm" data-act="clearf">${ico('x',14)}Clear filters</button>`:''}

/* ----- Calendar ----- */
function viewCalendar(){
  const {y,m,sel}=ui.cal;const first=new Date(y,m,1),lead=(first.getDay()+6)%7,dim=new Date(y,m+1,0).getDate(),t=todayStr();
  const by={};S.homework.forEach(h=>(by[h.dueDate]=by[h.dueDate]||[]).push(h));
  const cells=[];for(let i=0;i<lead;i++)cells.push(addDays(ymd(first),i-lead));
  for(let d=1;d<=dim;d++)cells.push(`${y}-${pad(m+1)}-${pad(d)}`);
  while(cells.length%7)cells.push(addDays(cells[cells.length-1],1));
  const cell=d=>{const l=by[d]||[];const p=l.filter(h=>statusOf(h)==='pending').length,c=l.filter(h=>h.completed).length,o=l.filter(h=>statusOf(h)==='overdue').length;

    return`<button class="day ${out?'out':''} ${d===t?'today':''} ${d===sel?'sel':''}" data-act="calsel" data-d="${d}" aria-label="${fmtDate(d,true)}, ${l.length} assignments"><span class="n">${+d.slice(8)}</span><span class="dots">${p?`<i>${p}</i>`:''}${c?`<i class="ok">${c}</i>`:''}${o?`<i class="bad">${o}</i>`:''}</span></button>`};

  <div class="grid cols-2" style="grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)">
    <div class="card"><div class="cal">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<div class="dow">${x}</div>`).join('')}${cells.map(cell).join('')}</div>
      <div class="legend" style="margin-top:14px"><span>Pending</span><span class="ok">Completed</span><span class="bad">Overdue</span></div></div>
    <div class="card"><h2>${fmtDate(sel,true)}${sel===t?' <span class="pill acc">Today</span>':''}</h2>
      ${hwList(selList,'Nothing due on this day.')}
      <button class="btn" style="margin-top:12px;width:100%" data-act="add" data-date="${sel}">${ico('plus',16)}Add for this day</button></div>
  </div>`;

/* ----- Statistics ----- */
function viewStats(){
  const T=S.student,li=levelInfo(T.totalXP),stk=getStreak(),t=todayStr(),ws=weekStart(t),mo=t.slice(0,7);
  const done=S.homework.filter(h=>h.completed);
  const dOf=h=>localDate(h.completedAt);
  const wk=done.filter(h=>dOf(h)>=ws).length,mn=done.filter(h=>dOf(h).startsWith(mo)).length;
  const xpWk=S.xpLog.filter(e=>e.date>=ws).reduce((a,e)=>a+e.amount,0),xpMn=S.xpLog.filter(e=>e.date.startsWith(mo)).reduce((a,e)=>a+e.amount,0);
  const overall=S.homework.length?Math.round(done.length/S.homework.length*100):0;
  const kpi=[[done.length,'Homework completed'],[fmtNum(T.totalXP),'Total XP'],[li.level,'Current level'],[stk.current,'Day streak'],[overall+'%','Overall completion'],[wk,'Completed this week'],[mn,'Completed this month'],[fmtNum(xpWk),'XP this week'],[fmtNum(xpMn),'XP this month']];
  const {metric,range}=ui.stat;
  const days=[];for(let i=range-1;i>=0;i--)days.push(addDays(t,-i));
  const xpByDay=dailyXP();
  const vals=days.map(d=>metric==='tasks'?done.filter(h=>dOf(h)===d).length:(xpByDay[d]||0));
  const mx=Math.max(1,...vals);
  const xs=new Map();S.xpLog.forEach(e=>{const k=e.subjectId||e.subjectName;const cur=xs.get(k)||{name:subj(e.subjectId).id?subj(e.subjectId).name:(e.subjectName||'Unknown'),accent:subj(e.subjectId).accent,xp:0};cur.xp+=e.amount;xs.set(k,cur)});
  const xl=[...xs.values()].sort((a,b)=>b.xp-a.xp),xmax=Math.max(1,...xl.map(x=>x.xp));
  const cs=S.subjects.map(s=>({s,...subStats(s.id)})).filter(x=>x.total).sort((a,b)=>b.pct-a.pct);
  return`<div class="page-h"><div><h1>Statistics</h1><p>How you're doing over time.</p></div></div>
  <div class="kpis">${kpi.map(([v,l])=>`<div class="kpi"><b>${v}</b><span>${l}</span></div>`).join('')}</div>
  <section class="card" style="margin-top:16px"><div class="row between wrap" style="margin-bottom:6px"><h2 style="margin:0">Productivity</h2>
    <div class="row wrap"><div class="seg">${[['tasks','Assignments'],['xp','XP']].map(([k,l])=>`<button class="${metric===k?'on':''}" data-act="statm" data-k="${k}">${l}</button>`).join('')}</div>
    <div class="seg">${[7,14,30].map(n=>`<button class="${range===n?'on':''}" data-act="statr" data-k="${n}">${n}d</button>`).join('')}</div></div></div>
    <div class="vbars" role="img" aria-label="${metric==='tasks'?'Assignments completed':'XP earned'} per day">${days.map((d,i)=>`<div class="vb ${metric==='xp'?'xpm':''}">${vals[i]?`<em>${vals[i]}</em>`:''}<div class="col" style="height:${Math.round(vals[i]/mx*100*.78)}%"></div><small>${range<=14?WD[parseYmd(d).getDay()].slice(0,2):(i%5===0?+d.slice(8):'')}</small></div>`).join('')}</div></section>
  <div class="grid cols-2" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr));margin-top:16px">
    <section class="card"><h2>XP by subject</h2>${xl.length?`<div class="hbars">${xl.map(x=>`<div class="hb"><span>${esc(x.name)}</span>${bar(Math.round(x.xp/xmax*100),{cls:'sub sm',ac:x.accent})}<span>${fmtNum(x.xp)}</span></div>`).join('')}</div>`:'<p class="muted">Complete an assignment to see XP by subject.</p>'}</section>
    <section class="card"><h2>Completion by subject</h2>${cs.length?`<div class="hbars">${cs.map(x=>`<div class="hb"><span>${esc(x.s.name)}</span>${bar(x.pct,{cls:'sub sm',ac:x.s.accent})}<span>${x.pct}%</span></div>`).join('')}</div>`:'<p class="muted">Add homework to see completion by subject.</p>'}</section>
  </div>`;
}

const modals=[];
function openModal(html,{cls='',onClose,locked=false}={}){
  const ov=document.createElement('div');ov.className='overlay';ov.innerHTML=`<div class="modal ${cls}" role="dialog" aria-modal="true">${html}</div>`;
  $('#modal-root').appendChild(ov);
  const m={ov,el:ov.firstElementChild,onClose,locked};modals.push(m);
  ov.addEventListener('mousedown',e=>{if(e.target===ov&&!locked)closeModal(m)});
  ov.addEventListener('click',e=>{if(e.target.closest('[data-close]'))closeModal(m)});
  const f=m.el.querySelector('[autofocus],input:not([type=file]),select,textarea,button');if(f)setTimeout(()=>f.focus({preventScroll:true}),30);
  return m;
}
function closeModal(m){m=m||modals[modals.length-1];if(!m)return;const i=modals.indexOf(m);if(i<0)return;modals.splice(i,1);m.ov.remove();if(m.onClose)m.onClose()}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(ui.notifOpen){toggleNotifs(false);return}const m=modals[modals.length-1];if(m&&!m.locked)closeModal(m)}});
function confirmDialog({title,body,ok='Confirm',danger=false}){
  return new Promise(res=>{let settled=false;
    const m=openModal(`<div class="mh"><h2>${esc(title)}</h2></div><div class="mb"><p class="muted">${body}</p></div>
      <div class="mf"><button class="btn" data-close data-no>Cancel</button><button class="btn ${danger?'danger solid':'primary'}" data-yes>${esc(ok)}</button></div>`,{cls:'narrow',onClose:()=>{if(!settled)res(false)}});
    m.el.querySelector('[data-yes]').onclick=()=>{settled=true;closeModal(m);res(true)};
  });
}
const mhead=(t)=>`<div class="mh"><h2>${t}</h2><button class="iconbtn sm" data-close aria-label="Close">${ico('x',18)}</button></div>`;

    <div class="field"><span>Attachments</span><div><label class="btn sm" style="cursor:pointer">${ico('clip',14)}Add files<input type="file" id="attin" multiple hidden></label></div><div class="thumbs" id="attlist"></div></div>

    ${!editing&&Class.status==='ready'&&Class.canWrite!==false?`<label class="row full" style="cursor:pointer"><input type="checkbox" name="shareClass"> <span>Also post this to the class agenda (everyone can see it; only you and an admin can edit or delete it)</span></label>`:''}
    ${editing&&d.sourceImageId&&S.files[d.sourceImageId]?`<div class="field full"><span>Added from this photo</span><div class="thumbs"><button type="button" class="att" data-view="${esc(d.sourceImageId)}"><img alt="" src="${esc(S.files[d.sourceImageId].thumb)}">View photo</button></div></div>`:''}
    <p class="err" id="formerr" style="color:var(--bad);font-size:13.5px;grid-column:1/-1" role="alert"></p>
  </div>
  <div class="mf" style="padding:6px 0 0">${editing?`<button type="button" class="btn danger" data-del>${ico('trash',16)}Delete</button><span style="flex:1"></span><button type="button" class="btn primary" data-close>Done</button>`:`<button type="button" class="btn" data-close>Cancel</button><button type="submit" class="btn primary">Add homework</button>`}</div></form>`,
    {cls:'wide',locked:!editing,onClose:()=>{if(!editing&&!saved)addedFiles.forEach(id=>{delete S.files[id];P.delFile(id)})}});
  const form=m.el.querySelector('#hwform'),q=n=>form.elements[n];

/* ----- Upload flow: choose → read → review/confirm ----- */
function openUploadFlow(){
  const U={items:[],busy:false,aiOff:!S.settings.aiReading,note:''};
  const m=openModal(`${mhead('Upload agenda photos')}<div class="mb" id="upbody"></div><div class="mf" id="upfoot"></div>`,{cls:'wide',locked:true});
  const body=$('#upbody',m.el),foot=$('#upfoot',m.el);
  const err=c=>({not_granted:'Automatic reading was declined, so fill in the details by hand.',unavailable:'Automatic reading isn\u2019t available here, so fill in the details by hand.',images_unavailable:'Automatic reading can\u2019t use images here, so fill in the details by hand.',rate_limited:'Too many requests right now. Fill in the details by hand, or try again in a moment.',image_rejected:'That image couldn\u2019t be read. Fill in the details by hand.',sampling_disabled:'Automatic reading is turned off for this account.'}[c]||'Couldn\u2019t read this photo automatically. Fill in what you see.');
  const newDet=(o={})=>({k:uid('d'),subjectId:'',title:'',description:'',dueDate:'',dueTime:'',difficulty:'medium',confidence:'',added:false,removed:false,...o});
  function stepPick(){
    body.innerHTML=`<div class="drop" id="drop">${ico('image',34)}<b style="color:var(--text);font-size:17px">Choose or drop photos here</b><span>JPG, PNG or WEBP. You can select multiple photos at once.</span>
      <button type="button" class="btn primary" id="choosephotos" style="margin-top:6px">${ico('image',16)}Choose photos</button><input id="imgin" type="file" accept="image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp" multiple hidden></div>
      <p class="hint" style="margin-top:12px">${U.aiOff?'Automatic reading is off. You\u2019ll type the details next to each photo.':'We\u2019ll try to read each photo and suggest the subject, task and date. Nothing is added until you confirm it.'}</p>`;
    foot.innerHTML=`<button class="btn" data-close>Cancel</button>`;
    const inp=$('#imgin',body),drop=$('#drop',body),choose=$('#choosephotos',body);
    choose.onclick=()=>{inp.value='';inp.click()};
    inp.onchange=()=>{const files=[...inp.files];if(files.length)handle(files);};
    drop.ondragover=e=>{e.preventDefault();drop.classList.add('over')};drop.ondragleave=()=>drop.classList.remove('over');
    drop.ondrop=e=>{e.preventDefault();drop.classList.remove('over');const files=[...e.dataTransfer.files];if(files.length)handle(files);};
  }
  async function handle(files){
    files=files.filter(imageFileSupported);
    if(!files.length)return toast('Choose JPG, PNG or WEBP images.',{kind:'bad'});
    if(files.length>10){files=files.slice(0,10);toast('Only the first 10 photos were selected.',{kind:'bad',ms:4500});}
    U.busy=true;U.items=files.map(f=>({file:f,status:'wait',dets:[],meta:null,dataUrl:'',msg:''}));renderReview();
    for(const it of U.items){
      it.status='read';renderReview();
      try{const r=await storeImage(it.file,'agenda');it.meta=r.meta;it.dataUrl=r.dataUrl;
        if(!U.aiOff){
          try{const out=await readImageWithAI(r.blob);it.meta.extractedText=out.rawText;it.meta.ocr={engine:'claude',status:'done',items:out.items,at:new Date().toISOString()};
            it.dets=out.items.map(x=>newDet({...x}));it.status='done';
            if(!it.dets.length){it.dets=[newDet()];it.msg='We couldn\u2019t find homework in this photo. Add it by hand if you can see some.'}
          }catch(e){const c=e&&e.code;if(['not_granted','sampling_disabled','capability_disabled','unavailable','images_unavailable'].includes(c))U.aiOff=true;
            it.meta.ocr={engine:'claude',status:'failed',error:c||'error',at:new Date().toISOString()};it.dets=[newDet()];it.status='manual';it.msg=err(c)}
        }else{it.dets=[newDet()];it.status='manual';it.msg=''}
        S.files[it.meta.id]=it.meta;P.file(it.meta,it.dataUrl);
      }catch(e){it.status='fail';it.msg='This image couldn\u2019t be opened. Try a JPG or PNG.'}
      renderReview();
    }
    U.busy=false;renderReview();
  }
  function detCard(it,ii,dt,di){
    if(dt.removed)return'';
    if(dt.added){const s=subj(dt.subjectId);return`<div class="det added"><div class="row">${tile(s,'sm')}<b>${esc(s.name)}</b><span class="muted">${esc(dt.title)}</span><span class="pill ok" style="margin-left:auto">Added</span></div></div>`}
    return`<div class="det" data-ii="${ii}" data-di="${di}">
      ${dt.confidence?`<span class="hint">Detected${dt.confidence==='low'?' (low confidence, please check)':''}. Check and correct anything below.</span>`:''}
      <div class="fgrid"><label class="field"><span>Subject</span><select class="sel" data-f="subjectId"><option value="">Choose…</option>${subjectOptions(dt.subjectId)}</select></label>
      <label class="field"><span>Difficulty</span><select class="sel" data-f="difficulty">${Object.entries(DIFF).map(([k,v])=>`<option value="${k}" ${dt.difficulty===k?'selected':''}>${v.label} · ${v.xp} XP</option>`).join('')}</select></label>
      <label class="field full"><span>Homework</span><input class="inp" data-f="title" value="${esc(dt.title)}" placeholder="Exercises 4–8"></label>
      <label class="field full"><span>Details (optional)</span><input class="inp" data-f="description" value="${esc(dt.description)}"></label>
      <label class="field"><span>Due date</span><input class="inp" type="date" data-f="dueDate" value="${esc(dt.dueDate)}"></label>
      <label class="field"><span>Due time (optional)</span><input class="inp" type="time" data-f="dueTime" value="${esc(dt.dueTime)}"></label></div>
      <div class="row wrap"><button class="btn primary sm" data-confirm>Confirm</button><button class="btn ghost sm" data-remove>Discard</button><span class="hint" data-derr style="color:var(--bad)"></span></div></div>`;
  }
  function renderReview(){
    const total=U.items.length,read=U.items.filter(i=>['done','manual','fail'].includes(i.status)).length;
    body.innerHTML=(U.busy?`<p class="muted" style="margin-bottom:6px">Reading photo ${Math.min(read+1,total)} of ${total}…</p>`:`<p class="muted">Check each item, fix anything that\u2019s wrong, then confirm.</p>`)+
      U.items.map((it,ii)=>`<div class="src"><div>${it.dataUrl?`<img alt="Uploaded photo ${ii+1}" src="${it.dataUrl}" data-zoom="${ii}">`:`<div style="width:130px;height:130px;border-radius:12px;background:var(--bg2)"></div>`}</div>
        <div class="stack">${it.status==='wait'?'<p class="muted">Waiting…</p>':it.status==='read'?'<p class="muted">Reading this photo…</p>':it.status==='fail'?`<p style="color:var(--bad)">${esc(it.msg)}</p>`:
          `${it.msg?`<p class="muted" style="font-size:14px">${esc(it.msg)}</p>`:''}${it.dets.map((dt,di)=>detCard(it,ii,dt,di)).join('')}<div><button class="btn ghost sm" data-adddet="${ii}">${ico('plus',14)}Add another from this photo</button></div>`}</div></div>`).join('');
    const pend=U.items.some(it=>it.dets.some(d=>!d.added&&!d.removed&&d.title.trim()));

  const json=JSON.stringify({app:'school-agenda',format:1,exportedAt:new Date().toISOString(),stores:snap});

  if(dl){try{await dl.save({filename:name,data:json});toast('Backup ready');return}catch(e){if(e&&e.code==='declined')return}}
  const m=openModal(`${mhead('Copy your backup')}<div class="mb stack"><p class="muted">Downloading isn\u2019t available here. Copy this text and keep it in a file named <b>${esc(name)}</b>. You can paste it back under Import.</p><textarea class="txt" id="bk" readonly style="min-height:160px;font-family:monospace;font-size:12px">${esc(json)}</textarea></div><div class="mf"><button class="btn" data-close>Close</button><button class="btn primary" id="cp">Copy to clipboard</button></div>`,{cls:'wide'});
  $('#cp',m.el).onclick=async()=>{try{await navigator.clipboard.writeText(json);toast('Copied')}catch(e){$('#bk',m.el).select();toast('Press Ctrl+C to copy the selected text.')}};
}
function validateBackup(o){
  if(!o||o.app!=='school-agenda'||!o.stores||typeof o.stores!=='object')return'This doesn\u2019t look like an Agenda backup file.';
  for(const[n]of STORES){if(o.stores[n]!==undefined&&!Array.isArray(o.stores[n]))return`The backup is damaged (${n}).`}
  if(!Array.isArray(o.stores.homework)||!Array.isArray(o.stores.subjects))return'The backup is missing homework or subjects.';
  return'';
}
function openImport(){
  const m=openModal(`${mhead('Import backup')}<div class="mb stack"><label class="btn" style="cursor:pointer;justify-self:start">${ico('upload',16)}Choose backup file<input id="bkfile" type="file" accept=".json,application/json" hidden></label>
    <label class="field"><span>…or paste the backup text</span><textarea class="txt" id="bktext" style="min-height:90px"></textarea></label><p id="imperr" style="color:var(--bad);font-size:13.5px" role="alert"></p></div>
    <div class="mf"><button class="btn" data-close>Cancel</button><button class="btn primary" id="goimp">Continue</button></div>`);
  const run=async text=>{
    let o;try{o=JSON.parse(text)}catch(e){$('#imperr',m.el).textContent='That file isn\u2019t valid JSON.';return}
    const bad=validateBackup(o);if(bad){$('#imperr',m.el).textContent=bad;return}
    const ok=await confirmDialog({title:'Import backup',body:'This will replace your current saved data. Continue?',ok:'Import',danger:true});if(!ok)return;
    if(!Data.ok){$('#imperr',m.el).textContent='Saving isn\u2019t available in this browser, so nothing can be imported.';return}
    try{
      /* Backups are merged, never used to wipe the current database.
         Existing records win on ID collisions unless the backup contains a newer updatedAt. */
      const cur=await Data.dump();
      const merged={...cur};
      for(const [store,rows] of Object.entries(o.stores)){
        if(!Array.isArray(rows))continue;
        const key=(STORES.find(x=>x[0]===store)||[])[1];
        if(!key){merged[store]=rows;continue}
        const map=new Map((cur[store]||[]).map(r=>[r?.[key],r]));
        for(const r of rows){
          if(!r||r[key]==null)continue;
          const existing=map.get(r[key]);
          if(!existing){map.set(r[key],r);continue}
          const ru=String(r.updatedAt||r.createdAt||'');
          const eu=String(existing.updatedAt||existing.createdAt||'');
          if(ru>eu)map.set(r[key],r);
        }
        merged[store]=[...map.values()];
      }
      await Data.replaceAll(merged);
      await loadState();closeModal(m);renderAll();toast('Backup imported without deleting existing data');
    }catch(e){console.error(e);$('#imperr',m.el).textContent='Import failed and your current data was left untouched.'}
  };
  $('#bkfile',m.el).onchange=async e=>{const f=e.target.files[0];if(f)run(await f.text())};
  $('#goimp',m.el).onclick=()=>{const t=$('#bktext',m.el).value.trim();if(t)run(t);else $('#imperr',m.el).textContent='Choose a file or paste the backup text.'};
}

/* =====================================================================
   12b. CLASS AGENDA (shared). Everyone with access can read every post.
   Only the person who posted it, or an admin, can edit or delete it.
   This is enforced by the database rules declared at publish time, not just by hiding buttons:
     agendas                read: everyone   write: admin
     agendas/{self}         write: that person (Contributor or above)
   Each person's posts live in agendas/<their id>, so nobody else can write there except admins.
   ===================================================================== */
const Class={
  db:null,user:null,me:null,isAdmin:false,canWrite:null,docs:[],prof:{},status:'loading',
  q:{},mine:false,subject:'',className:'',classKey:'',people:[],peopleStatus:'off',
  profileWatch:null,agendaWatch:null,lastError:'',lastSyncAt:null
};
const clip=(s,n)=>String(s??'').slice(0,n);
const MAX_POSTS_PER_PERSON=120;

function normPost(e,ownerId){
  if(!e||typeof e!=='object'||!e.id)return null;
  const sj={
    name:clip(e.subject_name||e.subject?.name||'Subject',30),
    icon:clip(e.subject_icon||e.subject?.icon||'•',4),
    accent:/^#[0-9a-f]{6}$/i.test(e.subject_accent||e.subject?.accent||'')?(e.subject_accent||e.subject.accent):'#8a90b3'
  };
  return{
    id:String(e.id),
    ownerId:String(e.owner_id||ownerId||''),
    ownerName:clip(e.owner_name||'',60),
    className:clip(e.class_name||'',40),
    classKey:clip(e.class_key||'',60),
    subject:sj,
    type:TYPES[e.type]?e.type:'homework',
    title:clip(e.title||'Untitled',160),
    description:clip(e.description,600),
    dueDate:parseYmd(e.due_date||e.dueDate)?(e.due_date||e.dueDate):todayStr(),
    dueTime:/^\d{2}:\d{2}$/.test(e.due_time||e.dueTime||'')?(e.due_time||e.dueTime):'',
    priority:PRIO[e.priority]?e.priority:'medium',
    difficulty:DIFF[e.difficulty]?e.difficulty:'medium',
    notes:clip(e.notes,600),
    imagePath:e.image_path||e.imagePath||null,
    imagePaths:(Array.isArray(e.image_paths)?e.image_paths.map(String).filter(Boolean):(e.image_path||e.imagePath?[String(e.image_path||e.imagePath)]:[])),
    createdAt:String(e.created_at||e.createdAt||''),
    updatedAt:String(e.updated_at||e.updatedAt||'')
  };
}
const classPosts=()=>Class.docs.map(d=>normPost(d,d.owner_id)).filter(Boolean)
  .sort((a,b)=>a.dueDate.localeCompare(b.dueDate)||(a.dueTime||'99:99').localeCompare(b.dueTime||'99:99')||a.createdAt.localeCompare(b.createdAt));
const canManage=p=>!!Class.me&&(p.ownerId===Class.me||Class.isAdmin);

function classError(e){
  const c=String(e&&e.code||e&&e.statusCode||'');
  const raw=String(e&&e.message||e&&e.error||'').toLowerCase();
  if(c==='not_configured')return'Shared cloud features are not configured yet.';
  if(c==='limit')return`You’ve reached the limit of ${MAX_POSTS_PER_PERSON} shared posts.`;
  if(c==='42501'||c==='PGRST301')return'You don’t have permission to change that shared post.';
  if(c==='PGRST116')return'That shared post no longer exists.';
  if(c==='quota_exceeded'||raw.includes('exceed_storage_size_quota')||raw.includes('storage quota'))return'Shared photo storage is full. Try again later or ask an admin to clean up old photos.';
  if(c==='413'||raw.includes('entitytoolarge')||raw.includes('too large'))return'That photo is too large. It was already compressed, but please choose a smaller image.';
  return sharedError(e,'Couldn’t save to the shared class agenda.');
}

async function fetchClassPosts(){
  if(!supabaseClient)return false;
  /* Register the CURRENT anonymous account and read its class in the same
     server-side transaction. This removes the remaining startup/session race:
     even a brand-new browser gets registered before the agenda is read. */
  const user=await ensureSupabaseUser();
  if(!user)throw new Error(SUPABASE_AUTH_LAST_ERROR||'Could not create the shared student session.');
  Class.me=user.id;
  const className=normalizeClassName(S.student.className);
  const key=classKey(className);
  if(!key)throw new Error('Your class is missing. Enter your class in Settings.');
  Class.className=className;Class.classKey=key;Class.lastError='';

  let data,error;
  ({data,error}=await supabaseClient.rpc('register_student_and_get_current_class_agenda',{
    p_name:String(S.student.name||'').trim().slice(0,40),
    p_class_name:className.slice(0,40)
  }));
  if(error){
    /* Fallback for an older project that does not have the combined RPC. */
    const reg=await cloudRegisterStudent(S.student.name,S.student.className,user);
    if(reg){
      S.student.id=reg.id;S.student.name=String(reg.name||S.student.name).slice(0,40);
      S.student.className=normalizeClassName(reg.class_name||S.student.className).slice(0,40);
      S.student.isAdmin=!!reg.is_admin;S.student.profileComplete=true;P.student();
      Class.me=reg.id;Class.className=S.student.className;Class.classKey=classKey(Class.className);Class.isAdmin=S.student.isAdmin;
    }
    const q=await supabaseClient.from('class_agenda_posts').select('*')
      .eq('class_key',Class.classKey)
      .order('due_date',{ascending:true,nullsFirst:false})
      .order('due_time',{ascending:true,nullsFirst:false})
      .order('created_at',{ascending:true});
    data=q.data;error=q.error;
  }
  if(error){Class.lastError=sharedError(error,'Could not load shared class agenda.');throw error}
  Class.docs=Array.isArray(data)?data:[];
  Class.prof={};
  for(const row of Class.docs)if(row.owner_id&&row.owner_name)Class.prof[row.owner_id]={name:row.owner_name};
  Class.lastSyncAt=new Date().toISOString();
  return true;
}
async function ensureClassCloudReady(){
  if(!SUPABASE_CONFIGURED||!supabaseClient)throw new Error('Shared cloud features are not configured yet.');
  const user=await ensureSupabaseUser();
  if(!user)throw new Error(SUPABASE_AUTH_LAST_ERROR||'Could not create the shared student session.');
  Class.me=user.id;
  await fetchClassPosts();
  Class.status='ready';
  Class.canWrite=true;
  return true;
}
async function fetchStudents(){
  if(!supabaseClient||!S.student.isAdmin)throw new Error('Administrator access is required.');
  const {data,error}=await supabaseClient.from('students')
    .select('id,name,class_name,is_admin,created_at,updated_at').order('name',{ascending:true});
  if(error)throw error;
  Class.people=(data||[]).map(p=>({
    id:p.id,name:String(p.name||'').slice(0,40),className:String(p.class_name||'').slice(0,40),
    isAdmin:!!p.is_admin,createdAt:p.created_at,updatedAt:p.updated_at
  }));
  Class.peopleStatus='ready';return true;
}
function stopCloudWatchers(){
  try{if(Class.profileWatch&&supabaseClient)supabaseClient.removeChannel(Class.profileWatch)}catch(e){}
  try{if(Class.agendaWatch&&supabaseClient)supabaseClient.removeChannel(Class.agendaWatch)}catch(e){}
  Class.profileWatch=null;Class.agendaWatch=null;
}
function startCloudWatchers(){
  if(!supabaseClient)return;
  stopCloudWatchers();
  Class.agendaWatch=supabaseClient.channel('agenda-'+(Class.classKey||'unknown'))
    .on('postgres_changes',{event:'*',schema:'public',table:'class_agenda_posts'},async()=>{
      try{await fetchClassPosts();if(ui.route.name==='class')renderView()}catch(e){console.error('Shared agenda refresh failed:',e)}
    }).subscribe();
  if(S.student.isAdmin){
    Class.profileWatch=supabaseClient.channel('students-directory')
      .on('postgres_changes',{event:'*',schema:'public',table:'students'},async()=>{
        try{await fetchStudents();if(ui.route.name==='students')renderView()}catch(e){console.error('Student directory refresh failed:',e)}
      }).subscribe();
  }
}
async function initClass(){
  Class.className=normalizeClassName(S.student.className);

  Class.me=S.student.id;Class.isAdmin=!!S.student.isAdmin;Class.canWrite=!!supabaseClient;

async function classUpdate(post,d,{newImage,removeImage}={}){
  if(!supabaseClient)throw{code:'not_configured'};
  await ensureClassCloudReady();
  const oldPaths=imagePathList(post);
  let imagePaths=oldPaths.slice(),newPaths=[];
  const incoming=Array.isArray(newImage)?newImage.filter(Boolean):(newImage?[newImage]:[]);
  if(incoming.length){
    imagePaths=[];
    for(let i=0;i<incoming.length;i++){
      const path=`${post.classKey||Class.classKey}/${Class.me}/post-${post.id}-${Date.now()}-${i+1}.jpg`;
      await cloudUploadImage(incoming[i],path);
      imagePaths.push(path);newPaths.push(path);
    }
  }else if(removeImage){imagePaths=[]}
  const s=subj(d.subjectId);
  /* Use the server-side ownership/class check for updates. This avoids the
     fragile client-side table UPDATE path that was producing a false
     "permission to change that shared post" error even for an admin/owner. */
  const {data:updated,error}=await supabaseClient.rpc('update_class_agenda_post',{
    p_id:post.id,
    p_subject_name:s.name,
    p_subject_icon:s.icon,
    p_subject_accent:s.accent,
    p_type:TYPES[d.type]?d.type:'homework',
    p_title:clip(String(d.title||'').trim(),160),
    p_description:clip(d.description,600),
    p_due_date:d.dueDate||null,
    p_due_time:d.dueTime||null,
    p_priority:PRIO[d.priority]?d.priority:'medium',
    p_difficulty:DIFF[d.difficulty]?d.difficulty:'medium',
    p_notes:clip(d.notes,600),
    p_image_paths:imagePaths
  });
  if(error||!updated){for(const path of newPaths)await cloudDeleteImage(path);if(error)throw error;throw new Error('The shared post could not be updated.')}
  for(const path of oldPaths){if(!imagePaths.includes(path))await cloudDeleteImageIfUnused(path,post.id)}
  await fetchClassPosts();if(ui.route.name==='class'||ui.route.name==='agenda')renderView();
}
async function classRemove(post){
  if(!supabaseClient)throw{code:'not_configured'};
  const {error}=await supabaseClient.from('class_agenda_posts').delete().eq('id',post.id);
  if(error)throw error;
  for(const path of imagePathList(post))await cloudDeleteImageIfUnused(path,post.id);
  await fetchClassPosts();if(ui.route.name==='class'||ui.route.name==='agenda')renderView();
}

async function retryCloudConnection(){
  SUPABASE_AUTH_LAST_ERROR='';
  try{
    const user=await ensureSupabaseUser();
    if(!user)throw new Error(SUPABASE_AUTH_LAST_ERROR||'Supabase did not return an authenticated user.');
    if(S.student.profileComplete){
      const p=await cloudOwnProfile();
      if(!p)await cloudRegisterStudent(S.student.name,S.student.className);
    }
    await initClass();
    toast('Shared cloud connection restored');
    renderAll();
  }catch(e){
    SUPABASE_AUTH_LAST_ERROR=sharedError(e,'Could not connect to the shared database.');
    renderAll();
    toast(SUPABASE_AUTH_LAST_ERROR,{kind:'bad',ms:7000});
  }
}
async function logoutAgenda(){
  const ok=await confirmDialog({title:'Log out?',body:'This signs out the current anonymous Supabase session and returns to profile setup. Your local homework, XP and saved files are not deleted.',ok:'Log out',danger:true});
  if(!ok)return;
  try{stopCloudWatchers();if(supabaseClient)await supabaseClient.auth.signOut({scope:'local'});}catch(e){console.error('Supabase sign-out failed:',e);}
  SUPABASE_AUTH_LAST_ERROR='';
  SUPABASE_CACHED_USER=null;SUPABASE_AUTH_PROMISE=null;
  S.student.profileComplete=false;S.student.id='student';S.student.name='';S.student.className='';S.student.isAdmin=false;
  try{await P.student();}catch(e){}
  $('#app').hidden=true;
  $('#boot').hidden=false;
  showSetup();
  toast('Logged out');
}

  more:()=>{const ids=MORE_NAV.filter(([id])=>id!=='students'||S.student.isAdmin);const m=openModal(`${mhead('More')}<div class="mb stack">${ids.map(([id,label])=>`<button class="btn" style="justify-content:flex-start" data-more="${id}">${ico(id==='statistics'?'stats':id,20)}${label}</button>`).join('')}</div>`);
    m.el.onclick=e=>{const b=e.target.closest('[data-more]');if(b){closeModal(m);go(b.dataset.more)}}},
  classpost:()=>openClassForm(),
  classedit:t=>{const p=classPosts().find(x=>x.id===t.dataset.pid);if(p)openClassForm(p)},
  classdel:async t=>{const p=classPosts().find(x=>x.id===t.dataset.pid);if(!p)return;
    if(await confirmDialog({title:'Delete this post?',body:`\u201C${esc(p.title)}\u201D will be removed for everyone in the class.`,ok:'Delete',danger:true})){
      try{await classRemove(p);toast('Post deleted')}catch(e){toast(classError(e),{kind:'bad'})}}},
  classadd:t=>{const p=classPosts().find(x=>x.id===t.dataset.pid);if(!p)return;
    const sid=matchSubject(p.subject.name)||S.subjects[0]?.id||'';
    A.addHomework({type:p.type,subjectId:sid,title:p.title,description:p.description,dueDate:p.dueDate,dueTime:p.dueTime,priority:p.priority,difficulty:p.difficulty,xp:autoXP(p.difficulty),notes:p.notes,classPostId:p.id});
    toast('Added to your homework')},
  classimgs:t=>{let paths=[];try{paths=JSON.parse(t.dataset.paths||'[]')}catch(e){paths=t.dataset.path?[t.dataset.path]:[]}viewClassImages(paths)},
  classf:t=>{if(t.dataset.k==='mine')Class.mine=!Class.mine;else Class.mine=false;renderView()},
  export:()=>exportBackup(),import:()=>openImport(),reset:()=>resetAll()
};
document.addEventListener('click',e=>{
  const nav=e.target.closest('a[data-go]');
  if(nav){e.preventDefault();ui.subTab='all';go(nav.dataset.go);return}
  const t=e.target.closest('[data-act]');if(!t)return;
  if(t.dataset.act==='edit'&&e.target.closest('.check'))return;
  const fn=ACT[t.dataset.act];if(fn){e.preventDefault();fn(t,e)}
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.dataset.classsub!==undefined){Class.subject=t.value;renderView();return}
  if(t.id==='classinp'){A.setProfile(S.student.name,t.value);return}
  if(t.dataset.set){
    const path=t.dataset.set;
    if(path==='browserNotify'&&t.checked){let ok=false;try{ok=(await Notification.requestPermission())==='granted'}catch(err){}if(!ok){t.checked=false;toast('Browser notifications were blocked. You can allow them in your browser settings.',{kind:'bad',ms:5000});return}}
    A.setSetting(path,t.checked);return;
  }
  if(t.dataset.filter){ui.f[t.dataset.filter]=t.value;renderView()}
});
document.addEventListener('input',e=>{
  if(e.target.id==='peopleq'){ui.peopleQuery=e.target.value;renderView();return}
  if(e.target.id==='nameinp'){clearTimeout(ui._nt);const v=e.target.value;ui._nt=setTimeout(()=>A.setName(v),350)}
  
  if(e.target.dataset&&e.target.dataset.filter==='date'){ui.f.date=e.target.value;renderView()}
});

/* ----- First-run profile setup ----- */
function showSetup(){
  const bootEl=$('#boot');
  bootEl.innerHTML=`<div class=\"boot-card\" style=\"width:min(460px,calc(100vw - 32px));text-align:left;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:var(--shadow);justify-items:stretch\">
    <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:18px\"><div class=\"brand\" style=\"padding:0\"><i>✦</i>Agenda</div></div>
    <h2 style=\"color:var(--text);font-size:28px;margin-bottom:5px\">Set up your profile</h2>
    <p style=\"color:var(--muted);margin-bottom:18px\">Enter your name and class to get started. You can use any name.</p>
    <form id=\"setupform\" style=\"display:grid;gap:12px\">
      <label class=\"field\"><span>Name</span><input class=\"inp\" id=\"setupname\" maxlength=40 placeholder=\"Your name\" required></label>
      <label class=\"field\"><span>Class</span><select class=\"sel\" id=\"setupclass\" required><option value=\"\" disabled selected>Select your class</option>${ALLOWED_CLASSES.map(c=>`<option value=\"${c}\">${c}</option>`).join('')}</select></label>
      <p id=\"setuperr\" style=\"color:var(--bad);font-size:13px;margin-top:2px\" role=\"alert\"></p>
      <button class=\"btn primary\" type=\"submit\">Continue</button>
    </form>
  </div>`;
  const f=$('#setupform'),err=$('#setuperr');
  f.onsubmit=async e=>{
    e.preventDefault();const name=$('#setupname').value.trim(),cls=normalizeClassName($('#setupclass').value);
    if(!name||!cls){err.textContent='Enter your name and class.';return}
    /* Admin privileges are verified only by Supabase RPC. Never trust or embed the admin code in client-side authorization logic. */
    const submit=f.querySelector('button[type="submit"]');submit.disabled=true;submit.textContent='Setting up…';err.textContent='';
    try{
      if(SUPABASE_CONFIGURED){
        const user=await ensureSupabaseUser();
        if(!user)throw new Error(SUPABASE_AUTH_LAST_ERROR||'The shared database could not create your student session.');
        const p=await cloudRegisterStudent(name,cls);
        if(!p)throw new Error('Your profile could not be saved to the shared database.');
        const final=await cloudOwnProfile();
        if(!final)throw new Error('Your shared profile could not be loaded.');
        S.student.id=final.id;S.student.name=String(final.name||name).slice(0,40);
        S.student.className=normalizeClassName(final.class_name||cls).slice(0,40);S.student.isAdmin=!!final.is_admin;
      }else{
        if(!S.student.id||S.student.id==='student')S.student.id=uid('student');
        S.student.isAdmin=false;
        toast('Saved locally. Shared class features need Supabase configuration.',{kind:'bad',ms:6000});
      }
      S.student.name=name.slice(0,40);S.student.className=normalizeClassName(cls).slice(0,40);S.student.profileComplete=true;
      if(SUPABASE_CONFIGURED){const p=await cloudOwnProfile();if(p){S.student.id=p.id;S.student.name=String(p.name||name).slice(0,40);S.student.className=normalizeClassName(p.class_name||cls).slice(0,40);S.student.isAdmin=!!p.is_admin}}
      P.student();
      const hp=location.hash.replace(/^#\/?/,'')||'dashboard';ui.routeStr=hp;ui.route=parseRoute(hp);
      shell();checkAchievements();refreshReminders();await initClass();
      $('#boot').remove();$('#app').hidden=false;renderAll();
    }catch(e2){console.error('Profile setup failed:',e2);err.textContent=sharedError(e2,'Could not complete profile setup. Try again.')}
    finally{submit.disabled=false;submit.textContent='Continue'}
  };
  setTimeout(()=>$('#setupname')?.focus(),30);
}

/* =====================================================================
   14. BOOT
   ===================================================================== */
async function boot(){
  Cap.get('downloads');Cap.get('sample');                                  /* warm up optional capabilities */
  try{
    await Data.open();
    try{Data.bc=new BroadcastChannel('school-agenda');Data.bc.onmessage=async()=>{if(Data.pending)return;try{await loadState();renderAll()}catch(e){}}}catch(e){}
  }catch(e){console.error(e);S.memoryOnly=true;Data.ok=false}
  try{
    if(Data.ok)await loadState();
    else{S.subjects=seedSubjects();applyTheme()}
  }catch(e){
    console.error(e);
    /* Never replace unreadable saved data with blank defaults. */
    $('#boot').innerHTML=`<div class="boot-card" style="max-width:420px;text-align:center;padding:20px"><h2 style="color:var(--text)">Couldn\u2019t open your saved agenda</h2><p>Your data hasn\u2019t been changed. Close other tabs of this page and reload. If it keeps happening, your browser may be restricting storage.</p><button class="btn primary" onclick="location.reload()">Reload</button></div>`;
    return;
  }
  if(!S.student.profileComplete){showSetup();return}
  if(SUPABASE_CONFIGURED){
    try{
      const user=await ensureSupabaseUser();
      if(!user){
        /* Keep personal data usable, but surface the cloud/auth problem instead of silently disabling Class Agenda. */
        console.warn('Shared cloud authentication is unavailable:',SUPABASE_AUTH_LAST_ERROR);
      }else{
        const p=await cloudOwnProfile();
        if(p){
          S.student.id=p.id;S.student.name=String(p.name||S.student.name).slice(0,40);
          S.student.className=normalizeClassName(p.class_name||S.student.className).slice(0,40);
          S.student.isAdmin=!!p.is_admin;S.student.profileComplete=true;P.student();
        }
      }
    }catch(e){SUPABASE_AUTH_LAST_ERROR=sharedError(e,'Could not restore the shared cloud profile.');console.error('Cloud profile restore failed:',e)}
  }
  const hp=location.hash.replace(/^#\/?/,'')||'dashboard';ui.routeStr=hp;ui.route=parseRoute(hp);
  shell();
  checkAchievements();refreshReminders();
  await initClass();
  $('#boot').remove();$('#app').hidden=false;
  renderAll();
  setInterval(()=>{refreshReminders();renderAll()},5*60*1000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden){refreshReminders();renderAll()}});
}
window.__agenda={Class,S,A,Data,levelInfo,xpFor,getStreak,ui,go,checkAchievements};
boot();
</script>
